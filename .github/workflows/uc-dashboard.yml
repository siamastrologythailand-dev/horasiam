name: uc-dashboard - update signature counts

# ดึงยอดผู้เข้าชื่อ ร่าง พ.ร.บ. หลักประกันสุขภาพฯ ทุก ~15 นาที แล้ว commit เฉพาะเมื่อยอดเปลี่ยน
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/uc-dashboard.yml"
      - ".github/scripts/uc_dashboard_update.py"

permissions:
  contents: write

concurrency:
  group: uc-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest counts
        run: python3 .github/scripts/uc_dashboard_update.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain uc-dashboard)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uc-dashboard/data.json uc-dashboard/snapshots.json
          git commit -m "uc-dashboard: update counts $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
          git pull --rebase --quiet
          git push
